<style>
/* Layout: one 速記帳 (shorthand pad) page in the center — ruled lines, a binding strip on top, questions written on the lines */
:root {
  --paper: #f6f8fb;
  --sheet: #ffffff;
  --rule: #d9e4f1;
  --margin-rule: #f0b9b4;
  --ink: #1d2742;
  --ink-soft: #55607a;
  --graphite: #3b4256;
  --pencil: #f2c230;
  --pencil-deep: #c9971a;
  --yes: #2a5bd7;
  --no: #ffffff;
  --no-ink: #1d2742;
  --chip: #eef2f8;
  --shadow: 0 1px 0 rgba(29,39,66,.06), 0 12px 32px -12px rgba(29,39,66,.22);
  --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12151d; --sheet: #1a1f2b; --rule: #273145; --margin-rule: #6b3a3a;
    --ink: #e8ecf5; --ink-soft: #a3acc2; --graphite: #c9cfdd;
    --pencil: #f2c230; --pencil-deep: #f2c230; --yes: #5b86f0; --no: #232a3a; --no-ink: #e8ecf5;
    --chip: #232a3a; --shadow: 0 12px 32px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12151d; --sheet: #1a1f2b; --rule: #273145; --margin-rule: #6b3a3a;
  --ink: #e8ecf5; --ink-soft: #a3acc2; --graphite: #c9cfdd;
  --pencil: #f2c230; --pencil-deep: #f2c230; --yes: #5b86f0; --no: #232a3a; --no-ink: #e8ecf5;
  --chip: #232a3a; --shadow: 0 12px 32px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 20px; }

.pad {
  position: relative;
  background-color: var(--sheet);
  background-image:
    linear-gradient(to right, transparent 39px, var(--margin-rule) 39px, var(--margin-rule) 40px, transparent 40px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--rule) 35px, var(--rule) 36px);
  background-position: 0 0, 0 52px;
  border-radius: 6px 6px 10px 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.pad::before { /* binding strip */
  content: "";
  display: block;
  height: 22px;
  background: var(--graphite);
  background-image: radial-gradient(circle at 50% 50%, var(--paper) 0 3px, transparent 3.5px);
  background-size: 28px 22px;
}
.inner { padding: 24px 22px 28px 56px; display: grid; gap: 18px; }

.eyebrow {
  font-family: var(--display);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .12em;
  color: var(--ink-soft);
}
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.4; }
h1 { font-size: clamp(26px, 6.4vw, 34px); font-weight: 900; }
h1 .mark { background: linear-gradient(transparent 62%, var(--pencil) 62%, var(--pencil) 92%, transparent 92%); }
p { margin: 0; }
.lead { color: var(--ink-soft); }

.btn {
  font-family: var(--display);
  font-weight: 700;
  font-size: 17px;
  border-radius: 999px;
  border: 2px solid var(--ink);
  padding: 12px 22px;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease;
  box-shadow: 0 3px 0 var(--ink);
  color: var(--ink);
  background: var(--sheet);
  text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--yes); outline-offset: 3px; }
.btn.primary { background: var(--pencil); color: #1d2742; }
.btn.yes { background: var(--yes); color: #fff; }
.btn.no { background: var(--no); color: var(--no-ink); }
.btn.x { background: #111; color: #fff; border-color: #111; box-shadow: 0 3px 0 #555; }
.btn.ghost { border-style: dashed; box-shadow: none; font-size: 15px; padding: 9px 16px; }
.btn.ghost:hover { box-shadow: none; }

.qhead { display: flex; align-items: center; gap: 12px; }
.qnum {
  font-family: var(--display); font-weight: 900; font-size: 15px;
  display: inline-flex; align-items: center; gap: 10px; color: var(--ink-soft);
  white-space: nowrap;
}
.qnum b {
  display: inline-grid; place-items: center;
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--ink); color: var(--sheet); font-size: 16px;
}
.meter { flex: 1; min-width: 0; height: 8px; border-radius: 999px; background: var(--chip); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--pencil); border-radius: 999px; transition: width .25s ease; }
.question { font-family: var(--display); font-weight: 700; font-size: clamp(21px, 5.2vw, 26px); line-height: 1.6; min-height: 3.2em; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.answers .btn { padding-block: 16px; font-size: 19px; }

.trail { display: flex; flex-wrap: wrap; gap: 6px; min-height: 26px; }
.trail span {
  font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px;
  background: var(--chip); color: var(--ink-soft);
}
.trail span.y { color: var(--yes); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* result */
.chara { display: grid; justify-items: center; gap: 4px; }
.chara-stage {
  width: 190px; max-width: 70%; aspect-ratio: 1 / 1.05;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 55%, var(--chip) 0 62%, transparent 63%);
  display: grid; place-items: center;
}
.chara-stage svg { width: 88%; height: auto; display: block; animation: bob 2.6s ease-in-out infinite; transform-origin: 50% 100%; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-1.5deg); } }
.chara-name { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--ink-soft); }
.chara-name b { color: var(--ink); font-size: 16px; }
.lineup { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; align-items: end; max-width: 380px; }
.lineup svg { width: 100%; height: auto; display: block; }
.lineup svg:nth-child(odd) { transform: translateY(-4px); }
.typename { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink-soft); }
.method { font-size: clamp(38px, 11vw, 54px); font-weight: 900; letter-spacing: .04em; }
.method .mark { background: linear-gradient(transparent 60%, var(--pencil) 60%, var(--pencil) 90%, transparent 90%); }
.points { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0; list-style: none; }
.points li {
  font-size: 14px; font-weight: 700; padding: 4px 12px; border-radius: 6px;
  border: 1.5px solid var(--ink); background: var(--sheet);
}
.note { font-size: 13px; color: var(--ink-soft); line-height: 1.7; }

.others { display: grid; gap: 10px; }
.others summary { cursor: pointer; font-family: var(--display); font-weight: 700; }
.others summary:focus-visible { outline: 3px solid var(--yes); outline-offset: 3px; border-radius: 4px; }
.others ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
.others li { padding: 8px 14px 8px 8px; border-radius: 8px; background: var(--chip); display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; }
.others li svg { width: 44px; height: auto; display: block; }
.others li strong { font-family: var(--display); }
.others li small { display: block; color: var(--ink-soft); font-size: 13px; }

footer { font-size: 12px; color: var(--ink-soft); text-align: center; line-height: 1.7; }

.fade { animation: fade .28s ease both; }
@keyframes fade { from { opacity: .2; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (max-width: 420px) {
  .inner { padding-left: 50px; padding-right: 16px; }
  .pad { background-image:
    linear-gradient(to right, transparent 33px, var(--margin-rule) 33px, var(--margin-rule) 34px, transparent 34px),
    repeating-linear-gradient(to bottom, transparent 0, transparent 35px, var(--rule) 35px, var(--rule) 36px); }
}
@media (prefers-reduced-motion: reduce) {
  .fade, .chara-stage svg { animation: none; }
  .btn, .meter i { transition: none; }
}
</style>

</head>
<body>
<div class="wrap">
  <section class="pad" aria-live="polite">
    <div class="inner" id="screen">
      <!-- start screen (rendered at rest; replaced by script) -->
      <p class="eyebrow">YES / NO で わかる</p>
      <h1>あなたに向いている<br><span class="mark">速記方式</span>は？</h1>
      <p class="lead">質問は全部で10問。直感でポンポン答えてください。結果はXでシェアできます。</p>
      <div class="row"><button class="btn primary" id="start" type="button">診断をはじめる</button></div>
    </div>
  </section>
  <footer>※ お遊びの診断です。実際の適性や方式の優劣を示すものではありません。<br>方式の紹介は、それぞれの特徴をざっくりとご紹介したものです。</footer>
</div>

<script>
// ▼ 公開後のURL（Xのシェア文に入ります）
const SHARE_URL = location.origin + location.pathname;
const HASHTAG = "速記方式診断";

// 10問すべてに答える形式。YES / NO それぞれで、方式ごとにポイントが入ります。
// どの方式も満点の合計が同じ（6点）になるように配点しています。
const Q = [
  { text: "ノートをとるとき、文字より矢印や記号をつい使ってしまう？",
    yes: { nakane: 1, yamane: 1, vshiki: 1 }, no: { shugiin: 1, sangiin: 1 } },
  { text: "新しいアプリやガジェットは、すぐに試してみたくなる？",
    yes: { vshiki: 2 }, no: { nakane: 1, sangiin: 1, yamane: 1 } },
  { text: "待ち合わせには、いつも少し早めに着いている？",
    yes: { shugiin: 1, sangiin: 1 }, no: { vshiki: 1, waseda: 1 } },
  { text: "説明書はあとまわし。まず触ってみる派？",
    yes: { vshiki: 1, ishimura: 1 }, no: { shugiin: 1, yamane: 1 } },
  { text: "人の話は、一言一句そのまま書き留めておきたくなる？",
    yes: { shugiin: 2 }, no: { sangiin: 1, nakane: 1 } },
  { text: "ひとりより、仲間とわいわい勉強するほうがはかどる？",
    yes: { waseda: 2 }, no: { yamane: 1, ishimura: 1 } },
  { text: "持ち物は少なめに、すっきりまとめたいほう？",
    yes: { nakane: 2 }, no: { waseda: 1, ishimura: 1 } },
  { text: "料理はレシピどおりより、自分流にアレンジしたくなる？",
    yes: { ishimura: 2 }, no: { waseda: 1, shugiin: 1 } },
  { text: "間違い探しは、わりと得意なほう？",
    yes: { yamane: 2 }, no: { waseda: 1, nakane: 1 } },
  { text: "話を最後までじっくり聞いてから、まとめるのが得意？",
    yes: { sangiin: 2 }, no: { vshiki: 1, ishimura: 1 } },
];

const R = {
  waseda: {
    name: "早稲田式",
    type: "みんなで走る 王道ランナー",
    body: "仲間と一緒に、コツコツ積み上げていくのが得意なあなた。早稲田式は川口渉が考案し、速記学校や通信教育を通じて、民間で広く親しまれてきた方式です。学んできた人が多いぶん、教材や先輩の知恵に出会いやすいのも心強いところ。にぎやかな道のりを楽しめるあなたにぴったりです。",
    points: ["続けるほど手になじむ", "仲間と励まし合える", "教材に出会いやすい"],
    color: "#3b6fd8", chara: "ハシルン",
  },
  nakane: {
    name: "中根式",
    type: "ひと筆に想いをこめる 線の美学派",
    body: "シンプルなものに心地よさを感じるあなた。中根式は1914年に中根正親が発表し、弟の正世が磨き上げた方式。ひとつの音をひと筆で書く「単画派」として、はじめて広く普及した方式といわれています。すっきりとした線の流れを味わいながら書きたい人に。",
    points: ["すっきりした線", "ひと筆のリズム", "長い歴史"],
    color: "#e27aa0", chara: "ヒトフデちゃん",
  },
  vshiki: {
    name: "V式",
    type: "まず触ってみる 身軽なチャレンジャー",
    body: "新しいことに、ためらわず飛び込めるあなた。V式は比較的新しい方式で、入門書では「簡単に、正確に、速く」書けることを目指す方式として紹介されています。はじめの一歩を軽やかに踏み出したい人の、頼れる相棒になってくれそうです。",
    points: ["はじめやすい", "新しい発想", "軽やかに上達"],
    color: "#f08a2c", chara: "ピースケ",
  },
  shugiin: {
    name: "衆議院式",
    type: "一言一句を大切にする 記録の職人",
    body: "細やかさと誠実さが光るあなた。衆議院式は、その名のとおり衆議院の議場で交わされる言葉を記録するために受け継がれてきた方式です。大切な言葉を正確に残すことに、静かなやりがいを感じられる人に。",
    points: ["ていねいさが生きる", "正確さへのこだわり", "記録の伝統"],
    color: "#34437a", chara: "イチゴンさん",
  },
  sangiin: {
    name: "参議院式",
    type: "じっくり聞いて流れをつかむ 聞き上手",
    body: "話にしっかり耳を傾け、全体の流れをつかむのが得意なあなた。参議院式は、参議院の速記者たちが議事を記録するために用いてきた方式です。落ち着いて人の言葉を受け止められるあなたの持ち味が、きっと生きてきます。",
    points: ["聞く力が生きる", "落ち着いた筆運び", "記録の伝統"],
    color: "#3a9d6e", chara: "キキミミ",
  },
  ishimura: {
    name: "石村式",
    type: "受け継いで自分流に磨く アレンジ職人",
    body: "学んだことを土台に、自分なりの工夫を重ねていくのが好きなあなた。石村式は、中根式を学んだ石村善左が基本文字に改良を加え、1951年に発表した方式です。受け継いだものを大切にしながら、より書きやすい形を探していく。そんな工夫好きのあなたと響き合いそうです。",
    points: ["工夫する楽しさ", "中根式の流れをくむ", "自分流に磨ける"],
    color: "#b5793a", chara: "タクミ",
  },
  yamane: {
    name: "山根式",
    type: "小さな違いに気づく 繊細な観察者",
    body: "ささいな違いにも、すっと気づける観察眼の持ち主のあなた。山根式は山根祐之が1951年に発表した方式で、線の向きや長さの違いで五十音を書き分ける「単画派」に属します。今も大学の速記部などで受け継がれています。細やかな書き分けを楽しめるあなたにぴったりです。",
    points: ["観察眼が生きる", "細やかな書き分け", "受け継がれる伝統"],
    color: "#8a63c9", chara: "ミツケル",
  },
};
const TYPES = Object.keys(R);

// ▼ イメージキャラ：方式ごとの色をした「えんぴつ」たち（オリジナル）
const LINE = "#1d2742";
function sparkle(x, y, r, fill) {
  return `<path d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r} Z" fill="${fill}" stroke="${LINE}" stroke-width="2" stroke-linejoin="round"/>`;
}
function mascot(key, label) {
  const c = R[key].color;
  const s = `stroke="${LINE}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
  let eyes = `<circle cx="91" cy="118" r="3.8" fill="${LINE}"/><circle cx="109" cy="118" r="3.8" fill="${LINE}"/>`;
  let mouth = `<path d="M94 128 Q100 134 106 128" fill="none" ${s} stroke-width="2.5"/>`;
  let armL = `M71 130 Q58 138 54 150`;
  let armR = `M129 130 Q142 138 146 150`;
  let back = "", front = "";

  switch (key) {
    case "waseda": // はちまき＋旗をふる
      armR = `M129 128 Q144 116 150 100`;
      mouth = `<path d="M93 127 Q100 138 107 127 Z" fill="#e5484d" ${s} stroke-width="2.5"/>`;
      front = `<rect x="68" y="80" width="64" height="11" fill="#e5484d" ${s} stroke-width="2.5"/>
        <path d="M70 84 L50 76 L54 92 Z" fill="#e5484d" ${s} stroke-width="2.5"/>
        <line x1="150" y1="104" x2="150" y2="54" ${s}/>
        <path d="M150 55 L178 64 L150 74 Z" fill="#f2c230" ${s} stroke-width="2.5"/>`;
      break;
    case "nakane": // お花をひとつ
      armL = `M71 128 Q58 124 52 114`;
      eyes = `<path d="M87 118 Q91 113 95 118" fill="none" ${s} stroke-width="2.6"/><path d="M105 118 Q109 113 113 118" fill="none" ${s} stroke-width="2.6"/>`;
      front = `<path d="M52 116 Q48 102 46 92" fill="none" stroke="#3a9d6e" stroke-width="3" stroke-linecap="round"/>
        ${[0, 72, 144, 216, 288].map(a => {
          const x = 46 + 8 * Math.cos((a - 90) * Math.PI / 180), y = 84 + 8 * Math.sin((a - 90) * Math.PI / 180);
          return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" fill="#ffffff" stroke="${LINE}" stroke-width="2"/>`;
        }).join("")}
        <circle cx="46" cy="84" r="4.5" fill="#f2c230" stroke="${LINE}" stroke-width="2"/>`;
      break;
    case "vshiki": // ピースとキラキラ
      armR = `M129 126 Q144 112 150 98`;
      eyes = `<path d="M87 119 Q91 114 95 119" fill="none" ${s} stroke-width="2.6"/><circle cx="109" cy="118" r="3.8" fill="${LINE}"/>`;
      mouth = `<path d="M93 127 Q100 136 107 127" fill="none" ${s} stroke-width="2.5"/>`;
      front = `<line x1="150" y1="98" x2="143" y2="82" ${s}/><line x1="150" y1="98" x2="159" y2="83" ${s}/>
        ${sparkle(42, 70, 10, "#f2c230")}${sparkle(166, 46, 8, "#f2c230")}${sparkle(34, 104, 6, "#ffffff")}`;
      break;
    case "shugiin": // めがね・蝶ネクタイ・手帳
      armL = `M71 130 Q60 138 58 146`;
      eyes += `<circle cx="91" cy="118" r="8.5" fill="none" stroke="${LINE}" stroke-width="2.5"/><circle cx="109" cy="118" r="8.5" fill="none" stroke="${LINE}" stroke-width="2.5"/><line x1="99.5" y1="118" x2="100.5" y2="118" stroke="${LINE}" stroke-width="2.5"/>`;
      front = `<path d="M100 152 L87 145 L87 159 Z M100 152 L113 145 L113 159 Z" fill="#e5484d" ${s} stroke-width="2.5"/>
        <circle cx="100" cy="152" r="3.5" fill="#e5484d" ${s} stroke-width="2"/>
        <rect x="34" y="140" width="26" height="32" rx="3" fill="#ffffff" ${s} stroke-width="2.5"/>
        <line x1="39" y1="150" x2="55" y2="150" stroke="${LINE}" stroke-width="2"/><line x1="39" y1="157" x2="55" y2="157" stroke="${LINE}" stroke-width="2"/><line x1="39" y1="164" x2="50" y2="164" stroke="${LINE}" stroke-width="2"/>`;
      break;
    case "sangiin": // ヘッドホンで聞き入る
      eyes = `<path d="M87 119 Q91 114 95 119" fill="none" ${s} stroke-width="2.6"/><path d="M105 119 Q109 114 113 119" fill="none" ${s} stroke-width="2.6"/>`;
      front = `<path d="M64 112 C 56 0, 144 0, 136 112" fill="none" stroke="${LINE}" stroke-width="5" stroke-linecap="round"/>
        <rect x="58" y="100" width="14" height="26" rx="6" fill="#34437a" ${s} stroke-width="2.5"/>
        <rect x="128" y="100" width="14" height="26" rx="6" fill="#34437a" ${s} stroke-width="2.5"/>
        <g fill="${LINE}"><circle cx="160" cy="80" r="5"/><rect x="163" y="58" width="3" height="22"/><path d="M163 58 Q172 62 174 70 Q168 65 166 66 Z"/>
        <circle cx="36" cy="66" r="4"/><rect x="38.5" y="48" width="2.5" height="18"/></g>`;
      break;
    case "ishimura": // てぬぐい＋小づち
      armR = `M129 128 Q142 132 148 140`;
      mouth = `<path d="M94 129 Q100 132 106 129" fill="none" ${s} stroke-width="2.5"/>`;
      back = `<rect x="147" y="100" width="7" height="44" rx="3" fill="#c98a4b" ${s} stroke-width="2.5"/>
        <rect x="134" y="92" width="32" height="14" rx="3" fill="#9aa4b5" ${s} stroke-width="2.5"/>`;
      front = `<rect x="68" y="80" width="64" height="13" fill="#34437a" ${s} stroke-width="2.5"/>
        <circle cx="80" cy="86.5" r="1.8" fill="#ffffff"/><circle cx="94" cy="86.5" r="1.8" fill="#ffffff"/><circle cx="108" cy="86.5" r="1.8" fill="#ffffff"/><circle cx="122" cy="86.5" r="1.8" fill="#ffffff"/>
        <path d="M70 86 L54 78 L56 96 Z" fill="#34437a" ${s} stroke-width="2.5"/>`;
      break;
    case "yamane": // 虫めがねでじっくり観察
      armR = `M129 128 Q144 128 150 122`;
      eyes = `<circle cx="91" cy="118" r="3.8" fill="${LINE}"/><circle cx="109" cy="117" r="5.5" fill="${LINE}"/><circle cx="111" cy="115" r="1.7" fill="#ffffff"/>`;
      mouth = `<path d="M96 129 Q100 132 104 129" fill="none" ${s} stroke-width="2.5"/>`;
      front = `<line x1="150" y1="124" x2="160" y2="108" stroke="${LINE}" stroke-width="7" stroke-linecap="round"/>
        <circle cx="170" cy="94" r="16" fill="#cfe6ff" fill-opacity=".75" stroke="${LINE}" stroke-width="4"/>
        <path d="M162 88 Q166 82 172 82" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>`;
      break;
  }

  return `<svg viewBox="0 0 200 222" role="img" aria-label="${esc(label || R[key].chara)}">
    <ellipse cx="100" cy="212" rx="40" ry="6" fill="${LINE}" fill-opacity=".12"/>
    ${back}
    <rect x="73" y="188" width="54" height="20" rx="8" fill="#f4a6b6" ${s}/>
    <rect x="70" y="72" width="60" height="108" fill="${c}" ${s}/>
    <line x1="90" y1="75" x2="90" y2="177" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
    <line x1="110" y1="75" x2="110" y2="177" stroke="#ffffff" stroke-opacity=".28" stroke-width="2"/>
    <rect x="69" y="176" width="62" height="15" rx="2" fill="#c9d1de" ${s}/>
    <path d="M70 72 L100 18 L130 72 Z" fill="#f3d6a4" ${s}/>
    <path d="M89.5 37 L100 18 L110.5 37 Z" fill="${c}" ${s}/>
    <ellipse cx="100" cy="123" rx="24" ry="21" fill="#fff8ec" stroke="${LINE}" stroke-width="2"/>
    <ellipse cx="83" cy="130" rx="5" ry="3" fill="#f6a5a5"/><ellipse cx="117" cy="130" rx="5" ry="3" fill="#f6a5a5"/>
    ${eyes}${mouth}
    <path d="${armL}" fill="none" ${s}/><path d="${armR}" fill="none" ${s}/>
    ${front}
  </svg>`;
}

const screen = document.getElementById("screen");
let picks = []; // true = YES, false = NO

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function animate() { screen.classList.remove("fade"); void screen.offsetWidth; screen.classList.add("fade"); }

function trailHTML() {
  return picks.map((p, i) => `<span class="${p ? "y" : ""}">Q${i + 1} ${p ? "YES" : "NO"}</span>`).join("");
}

function renderStart() {
  picks = [];
  screen.innerHTML = `
    <p class="eyebrow">YES / NO で わかる</p>
    <h1>あなたに向いている<br><span class="mark">速記方式</span>は？</h1>
    <div class="lineup" aria-label="7つのタイプのイメージキャラ">${TYPES.map(k => mascot(k)).join("")}</div>
    <p class="lead">質問は全部で10問。直感でポンポン答えてください。結果はXでシェアできます。</p>
    <div class="row"><button class="btn primary" id="start" type="button">診断をはじめる</button></div>`;
  animate();
  document.getElementById("start").addEventListener("click", renderQ);
}

function renderQ() {
  const i = picks.length;
  const q = Q[i];
  screen.innerHTML = `
    <div class="qhead">
      <div class="qnum"><b>Q${i + 1}</b>/ ${Q.length}</div>
      <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${i}" aria-label="回答の進み具合"><i style="width:${(i / Q.length) * 100}%"></i></div>
    </div>
    <p class="question">${esc(q.text)}</p>
    <div class="answers">
      <button class="btn yes" id="ans-yes" type="button">YES</button>
      <button class="btn no" id="ans-no" type="button">NO</button>
    </div>
    <div class="trail" aria-label="これまでの回答">${trailHTML()}</div>
    <div class="row">
      ${i ? `<button class="btn ghost" id="back" type="button">ひとつ戻る</button>` : ""}
      <button class="btn ghost" id="restart" type="button">最初から</button>
    </div>`;
  animate();
  document.getElementById("ans-yes").addEventListener("click", () => answer(true));
  document.getElementById("ans-no").addEventListener("click", () => answer(false));
  const back = document.getElementById("back");
  if (back) back.addEventListener("click", () => { picks.pop(); renderQ(); });
  document.getElementById("restart").addEventListener("click", renderStart);
  document.getElementById("ans-yes").focus({ preventScroll: true });
}

function answer(yes) {
  picks.push(yes);
  if (picks.length < Q.length) renderQ();
  else renderResult(judge(picks));
}

function judge(ans) {
  const score = Object.fromEntries(TYPES.map(t => [t, 0]));
  ans.forEach((yes, i) => {
    for (const [k, v] of Object.entries(yes ? Q[i].yes : Q[i].no)) score[k] += v;
  });
  const max = Math.max(...TYPES.map(t => score[t]));
  const tied = TYPES.filter(t => score[t] === max);
  // 同点のときは回答の並びから決める（同じ答え方なら毎回同じ結果）
  const h = ans.reduce((sum, yes, i) => sum + (yes ? i + 1 : 0), 0);
  return tied[h % tied.length];
}

function shareText(r) {
  return `速記方式タイプ診断の結果、わたしは【${r.name}】タイプ\n「${r.type}」でした！\nあなたに向いている速記方式は？`;
}

function renderResult(key) {
  const r = R[key];
  const text = shareText(r);
  const params = new URLSearchParams({ text, hashtags: HASHTAG });
  if (SHARE_URL) params.set("url", SHARE_URL);
  const xUrl = "https://twitter.com/intent/tweet?" + params.toString();
  const others = Object.entries(R).filter(([k]) => k !== key)
    .map(([k, o]) => `<li>${mascot(k)}<div><strong>${esc(o.name)}</strong><small>${esc(o.type)}</small></div></li>`).join("");

  screen.innerHTML = `
    <p class="eyebrow">診断結果</p>
    <div class="trail" aria-label="あなたの回答">${trailHTML()}</div>
    <div class="chara">
      <div class="chara-stage">${mascot(key)}</div>
      <p class="chara-name">イメージキャラ <b>${esc(r.chara)}</b></p>
    </div>
    <p class="typename">${esc(r.type)}</p>
    <h2 class="method"><span class="mark">${esc(r.name)}</span><span style="font-size:.42em;font-weight:700"> タイプ</span></h2>
    <p>${esc(r.body)}</p>
    <ul class="points">${r.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    <div class="row">
      <a class="btn x" id="share-x" href="${xUrl}" target="_blank" rel="noopener">Xで結果をポスト</a>
      <button class="btn ghost" id="copy" type="button">結果をコピー</button>
    </div>
    <p class="note" id="copy-msg" hidden></p>
    <div class="row">
      <button class="btn primary" id="again" type="button">もう一度診断する</button>
    </div>
    <details class="others">
      <summary>ほかのタイプも見てみる</summary>
      <ul>${others}</ul>
    </details>
    <p class="note">どの方式を選んでも、速記技能検定は方式を問わず受けられます。気になった方式から、気軽にのぞいてみてください。</p>`;
  animate();

  document.getElementById("again").addEventListener("click", renderStart);
  const msg = document.getElementById("copy-msg");
  document.getElementById("copy").addEventListener("click", () => {
    const full = text + "\n#" + HASHTAG + (SHARE_URL ? "\n" + SHARE_URL : "");
    const done = () => { msg.hidden = false; msg.textContent = "コピーしました。Xに貼り付けてポストできます。"; };
    try {
      navigator.clipboard.writeText(full).then(done, () => fallback(full));
    } catch (e) { fallback(full); }
    function fallback(t) {
      msg.hidden = false;
      msg.textContent = t;
      const range = document.createRange(); range.selectNodeContents(msg);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    }
  });
  screen.scrollIntoView({ block: "start", behavior: "smooth" });
}

renderStart();
</script>
